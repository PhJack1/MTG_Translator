<!DOCTYPE html>
<html>
<head>
  <title>MTG Cards Translator</title>
  <link rel="stylesheet" href="popup.css">
  <meta charset="UTF-8">
</head>
<body>
  <div class="container">

    <h1
      data-key="title"
      data-translations='{"es":"Traductor de Cartas MTG","fr":"Traducteur de Cartes MTG","de":"MTG Karten Übersetzer","it":"Traduttore di Carte MTG","pt":"Tradutor de Cartas MTG","ja":"MTGカード翻訳","ko":"MTG 카드 번역기","ru":"Переводчик карт MTG","zh":"MTG卡牌翻译","zh-TW":"MTG卡牌翻譯"}'
    >
      MTG Cards Translator
    </h1>

    <!-- ZONE FIXE -->
    <div class="fixed-top">

      <div class="flags">
        <div class="flag-row">
          <span class="flag" id="flag-es" data-lang="es">🇪🇸</span>
          <span class="flag" id="flag-fr" data-lang="fr">🇫🇷</span>
          <span class="flag" id="flag-de" data-lang="de">🇩🇪</span>
          <span class="flag" id="flag-it" data-lang="it">🇮🇹</span>
          <span class="flag" id="flag-pt" data-lang="pt">🇵🇹</span>
        </div>
        <div class="flag-row">
          <span class="flag" id="flag-ja" data-lang="ja">🇯🇵</span>
          <span class="flag" id="flag-ko" data-lang="ko">🇰🇷</span>
          <span class="flag" id="flag-ru" data-lang="ru">🇷🇺</span>
          <span class="flag" id="flag-zh" data-lang="zh">🇨🇳</span>
          <span class="flag" id="flag-zh-tw" data-lang="zh-TW">🇹🇼</span>
        </div>
      </div>

      <button
        id="translate-button"
        data-key="btn-translate"
        data-translations='{"es":"Traducir cartas en la página","fr":"Traduire les cartes sur la page","de":"Karten auf der Seite übersetzen","it":"Traduci le carte nella pagina","pt":"Traduzir cartas na página","ja":"ページ上のカードを翻訳","ko":"페이지의 카드 번역","ru":"Перевести карты на странице","zh":"翻译页面上的卡牌","zh-TW":"翻譯頁面上的卡牌"}'
      >
        Traduire les cartes sur la page
      </button>

      <!-- ✨ NOUVELLE CASE À COCHER AUTO-TRADUCTION ✨ -->
      <label class="auto-translate-label">
        <input 
          type="checkbox" 
          id="autoTranslateToggle"
        />
        <span 
          data-key="auto-translate-label"
          data-translations='{"es":"Traducción automática","fr":"Traduction automatique","de":"Automatische Übersetzung","it":"Traduzione automatica","pt":"Tradução automática","ja":"自動翻訳","ko":"자동 번역","ru":"Автоматический перевод","zh":"自动翻译","zh-TW":"自動翻譯"}'
        >
          Traduction automatique
        </span>
      </label>

    </div>

    <!-- ZONE CENTRALE (TAILLE FIXE) -->
    <div class="pages">

      <!-- PAGE 1 -->
      <div class="page active">
        <button
          id="import-button"
          data-key="btn-import"
          data-translations='{"es":"Importar","fr":"Importer","de":"Importieren","it":"Importa","pt":"Importar","ja":"インポート","ko":"가져오기","ru":"Импорт","zh":"导入","zh-TW":"導入"}'
        >
          Importer
        </button>

        <button
          id="export-button"
          data-key="btn-export"
          data-translations='{"es":"Exportar","fr":"Exporter","de":"Exportieren","it":"Esporta","pt":"Exportar","ja":"エクスポート","ko":"내보내기","ru":"Экспорт","zh":"导出","zh-TW":"導出"}'
        >
          Exporter
        </button>
      </div>

      <!-- PAGE 2 -->
      <div class="page">
        <textarea
          id="text-inputEn"
          data-key="input-en"
          data-translations='{"es":"Nombre de carta en Inglés","fr":"Nom de carte en Anglais","de":"Kartennamen auf Englisch","it":"Nome della carta in Inglese","pt":"Nome da carta em Inglês","ja":"英語でカード名","ko":"영어 카드 이름","ru":"Название карты на английском","zh":"英文卡牌名称","zh-TW":"英文卡牌名稱"}'
        ></textarea>

        <textarea
          id="text-inputTrad"
          data-key="input-trad"
          data-translations='{"es":"Nombre de carta en Español","fr":"Nom de carte en Français","de":"Kartennamen auf Deutsch","it":"Nome della carta in Italiano","pt":"Nome da carta em Português","ja":"カード名を日本語で","ko":"카드 이름을 한국어로","ru":"Название карты на русском","zh":"卡牌名称用中文","zh-TW":"卡牌名稱用繁體中文"}'
        ></textarea>

        <button
          id="saveDb-button"
          data-key="btn-save"
          data-translations='{"es":"Guardar","fr":"Enregistrer","de":"Speichern","it":"Salva","pt":"Salvar","ja":"保存","ko":"저장","ru":"Сохранить","zh":"保存","zh-TW":"保存"}'
        >
          Enregistrer
        </button>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer-nav">
      <button class="nav-arrow" id="nav-prev">◀</button>

      <div class="about-container">
        <a
          href="https://github.com/PhJack1/MTG_Translator/?tab=readme-ov-file#readme"
          target="_blank"
          data-key="about-link"
          data-translations='{"es":"Acerca de","fr":"À propos","de":"Über","it":"Informazioni","pt":"Sobre","ja":"この拡張について","ko":"정보","ru":"О расширении","zh":"关于","zh-TW":"關於"}'
        >
          À propos
        </a>
      </div>

      <button class="nav-arrow" id="nav-next">▶</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
